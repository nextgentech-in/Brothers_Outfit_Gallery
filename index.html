<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#111111" />
    <title>Brother’s Outfit Gallery | Men's Clothing Store in Himatnagar</title>
    <meta name="description" content="Shop premium men's clothing in Himatnagar. Discover trendy shirts, kurtas, denim, jeans &amp; accessories. Free delivery on orders over ₹999." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.brothersoutfitgallery.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brother’s Outfit Gallery" />
    <meta property="og:title" content="Brother’s Outfit Gallery | Men's Clothing Store in Himatnagar" />
    <meta property="og:description" content="Shop premium men's clothing in Himatnagar. Discover trendy shirts, festive kurtas, denims &amp; accessories. Free express shipping above ₹999." />
    <meta property="og:image" content="https://www.brothersoutfitgallery.com/images/brothers-storefront.jpg" />
    <meta property="og:url" content="https://www.brothersoutfitgallery.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brother’s Outfit Gallery | Men's Clothing Store in Himatnagar" />
    <meta name="twitter:description" content="Premium menswear for everyday confidence. Shop kurtas, shirts, jeans, tees &amp; accessories." />
    <meta name="twitter:image" content="https://www.brothersoutfitgallery.com/images/brothers-storefront.jpg" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Performance: Fast DNS Prefetch & Preconnect for Fonts, ImageKit & Firestore -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://ik.imagekit.io" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />
    <!-- Google Fonts with high-priority preload to eliminate FOUT / font flickering -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Preload critical hero image for fast LCP -->
    <link rel="preload" as="image" href="/images/brothers-storefront.jpg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
